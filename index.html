<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MoneyMind</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 8px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #27ae60;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #219150;
}

.delete {
  background: #e74c3c;
}

.delete:hover {
  background: #c0392b;
}

.total {
  margin-top: 15px;
  font-weight: bold;
}

.advice {
  margin-top: 15px;
  background: #ecf0f1;
  padding: 10px;
  border-radius: 5px;
}

.expense {
  border-bottom: 1px solid #ddd;
  padding: 5px 0;
}

canvas {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>MoneyMind – tu dinero claro con inteligencia automática</h1>

<div class="container">

<input type="number" id="amount" placeholder="Monto">
<select id="category">
  <option>Comida</option>
  <option>Transporte</option>
  <option>Entretenimiento</option>
  <option>Otros</option>
</select>
<input type="text" id="description" placeholder="Descripción">

<button onclick="addExpense()">Agregar gasto</button>
<button class="delete" onclick="clearExpenses()">Borrar todos los gastos</button>

<div class="total" id="total">Total gastado: $0</div>
<div class="advice" id="advice">Consejo IA: empezá registrando tus gastos.</div>

<canvas id="chart" width="400" height="200"></canvas>

<div id="expenses"></div>

</div>

<script>
let expenses = [];
const saved = localStorage.getItem("expenses");
if (saved) {
  expenses = JSON.parse(saved);
  render();
}

function addExpense() {
  const amount = Number(amountInput.value);
  const category = categoryInput.value;
  const description = descriptionInput.value;
  if (amount <= 0) return;

  expenses.push({
    amount,
    category,
    description,
    date: new Date().toLocaleDateString()
  });

  localStorage.setItem("expenses", JSON.stringify(expenses));
  amountInput.value = "";
  descriptionInput.value = "";
  render();
}

function clearExpenses() {
  if (!confirm("¿Seguro que querés borrar todo?")) return;
  expenses = [];
  localStorage.removeItem("expenses");
  render();
}

function render() {
  list.innerHTML = "";
  let total = 0;
  let categories = {};

  expenses.forEach(e => {
    total += e.amount;
    categories[e.category] = (categories[e.category] || 0) + e.amount;

    const div = document.createElement("div");
    div.className = "expense";
    div.textContent = `${e.date} | $${e.amount} | ${e.category} | ${e.description}`;
    list.appendChild(div);
  });

  totalDiv.textContent = "Total gastado: $" + total;
  generateAdvice(total, categories);
  drawChart(categories);
}

function generateAdvice(total, categories) {
  let biggest = "";
  let max = 0;

  for (let c in categories) {
    if (categories[c] > max) {
      max = categories[c];
      biggest = c;
    }
  }

  let advice = "Buen control de gastos.";
  if (total > 15000) advice = "Estás gastando mucho. Intentá reducir gastos innecesarios.";
  else if (biggest) advice = `Tu mayor gasto es en ${biggest}. Podrías optimizarlo.`;

  adviceDiv.textContent = "Consejo IA: " + advice;
}

function drawChart(categories) {
  const ctx = chart.getContext("2d");
  ctx.clearRect(0, 0, chart.width, chart.height);

  const keys = Object.keys(categories);
  if (keys.length === 0) return;

  const max = Math.max(...Object.values(categories));
  const barWidth = 60;
  let x = 20;

  keys.forEach(cat => {
    const height = (categories[cat] / max) * 150;
    ctx.fillStyle = "#27ae60";
    ctx.fillRect(x, 180 - height, barWidth, height);
    ctx.fillStyle = "#000";
    ctx.fillText(cat, x, 195);
    x += 80;
  });
}

// shortcuts
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const descriptionInput = document.getElementById("description");
const list = document.getElementById("expenses");
const totalDiv = document.getElementById("total");
const adviceDiv = document.getElementById("advice");
const chart = document.getElementById("chart");
</script>

</body>
</html>
