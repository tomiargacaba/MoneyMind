<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MoneyMind</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 8px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #27ae60;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #219150;
}

.pro {
  background: #2980b9;
}

.pro:hover {
  background: #1f5f8b;
}

.delete {
  background: #e74c3c;
}

.delete:hover {
  background: #c0392b;
}

.total {
  margin-top: 15px;
  font-weight: bold;
}

.advice {
  margin-top: 15px;
  background: #ecf0f1;
  padding: 10px;
  border-radius: 5px;
}

.expense {
  border-bottom: 1px solid #ddd;
  padding: 5px 0;
}

canvas {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>MoneyMind – tu dinero claro con inteligencia automática</h1>

<div class="container">

<input type="number" id="amount" placeholder="Monto">
<select id="category">
  <option>Comida</option>
  <option>Transporte</option>
  <option>Entretenimiento</option>
  <option>Otros</option>
</select>
<input type="text" id="description" placeholder="Descripción">

<button onclick="addExpense()">Agregar gasto</button>
<button class="delete" onclick="clearExpenses()">Borrar todos los gastos</button>
<button class="pro" onclick="togglePro()">Activar modo PRO</button>

<div class="total" id="total">Total gastado: $0</div>

<div class="advice" id="advice">Consejo IA: empezá registrando tus gastos.</div>

<canvas id="chart" width="500" height="220"></canvas>

<div id="expenses"></div>

</div>

<script>
let expenses = [];
let proMode = false;

// Cargar datos
const saved = localStorage.getItem("expenses");
if (saved) expenses = JSON.parse(saved);

const savedPro = localStorage.getItem("proMode");
if (savedPro === "true") proMode = true;

render();

/* =========================
   2️⃣ CONSEJOS IA INTELIGENTES
========================= */
function generateAdvice(total, categories) {
  let advice = "Buen control de gastos.";
  let biggest = "";
  let max = 0;

  for (let c in categories) {
    if (categories[c] > max) {
      max = categories[c];
      biggest = c;
    }
  }

  if (total > 20000) {
    advice = "Estás gastando mucho este período. Prioritá necesidades.";
  } else if (biggest) {
    advice = `Tu mayor gasto es en ${biggest}. Revisá si podés reducirlo.`;
  }

  if (proMode) {
    advice += " (Análisis PRO: podrías ahorrar hasta un 15% ajustando hábitos)";
  }

  adviceDiv.textContent = "Consejo IA: " + advice;
}

/* =========================
   4️⃣ MODO PRO
========================= */
function togglePro() {
  proMode = !proMode;
  localStorage.setItem("proMode", proMode);
  alert(proMode ? "Modo PRO activado" : "Modo PRO desactivado");
  render();
}

/* =========================
   1️⃣ GRÁFICO DE GASTOS
========================= */
function drawChart(categories) {
  const ctx = chart.getContext("2d");
  ctx.clearRect(0, 0, chart.width, chart.height);

  const keys = Object.keys(categories);
  if (keys.length === 0) return;

  const max = Math.max(...Object.values(categories));
  let x = 30;

  keys.forEach(cat => {
    const height = (categories[cat] / max) * 150;
    ctx.fillStyle = "#27ae60";
    ctx.fillRect(x, 180 - height, 60, height);
    ctx.fillStyle = "#000";
    ctx.fillText(cat, x, 200);
    x += 90;
  });
}

/* =========================
   3️⃣ BORRAR GASTOS
========================= */
function clearExpenses() {
  if (!confirm("¿Seguro que querés borrar todo?")) return;
  expenses = [];
  localStorage.removeItem("expenses");
  render();
}

/* =========================
   FUNCIONES PRINCIPALES
========================= */
function addExpense() {
  const amount = Number(amountInput.value);
  if (amount <= 0) return;

  expenses.push({
    amount,
    category: categoryInput.value,
    description: descriptionInput.value,
    date: new Date().toLocaleDateString()
  });

  localStorage.setItem("expenses", JSON.stringify(expenses));
  amountInput.value = "";
  descriptionInput.value = "";
  render();
}

function render() {
  list.innerHTML = "";
  let total = 0;
  let categories = {};

  expenses.forEach(e => {
    total += e.amount;
    categories[e.category] = (categories[e.category] || 0) + e.amount;

    const div = document.createElement("div");
    div.className = "expense";
    div.textContent = `${e.date} | $${e.amount} | ${e.category} | ${e.description}`;
    list.appendChild(div);
  });

  totalDiv.textContent = "Total gastado: $" + total;
  generateAdvice(total, categories);
  drawChart(categories);
}

// referencias
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const descriptionInput = document.getElementById("description");
const list = document.getElementById("expenses");
const totalDiv = document.getElementById("total");
const adviceDiv = document.getElementById("advice");
const chart = document.getElementById("chart");
</script>

</body>
</html>
