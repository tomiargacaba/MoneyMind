<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMind</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);margin:0;padding:0;min-height:100vh;display:flex;justify-content:center;align-items:center}
.container{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:20px;box-shadow:0 15px 40px rgba(0,0,0,.2)}
h1{text-align:center;margin:0 0 10px}
.section{margin-bottom:15px}
label{font-weight:600;font-size:14px}
input,select,button{width:100%;padding:10px;margin-top:5px;border-radius:10px;border:1px solid #ccc;font-size:14px}
button{background:#667eea;color:#fff;font-weight:600;border:none;cursor:pointer}
button:hover{opacity:.9}
.alert{padding:10px;border-radius:10px;margin-top:10px;font-size:14px}
.ok{background:#e6fffa;border-left:5px solid #38b2ac}
.warn{background:#fff5f5;border-left:5px solid #f56565}
#advice{margin-top:10px}
#list{margin-top:10px;font-size:13px}
.item{border-bottom:1px solid #eee;padding:5px 0}
.pro{background:#ffd700;color:#000;font-weight:600;margin-top:10px}
.chat{margin-top:10px}
.chat input{margin-bottom:5px}
</style>
</head>
<body>
<div class="container">
<h1>MoneyMind</h1>

<div class="section">
<label>¿Cuánta plata tenés?</label>
<input type="number" id="budget" placeholder="Ej: 50000">
</div>

<div class="section">
<label>Meta de gasto</label>
<input type="number" id="goal" placeholder="Ej: 20000">
<select id="period">
<option value="dia">Por día</option>
<option value="semana">Por semana</option>
<option value="mes">Por mes</option>
</select>
</div>

<div class="section">
<label>Monto</label>
<input type="number" id="amount">
<label>Categoría</label>
<select id="category">
<option>Comida</option>
<option>Transporte</option>
<option>Entretenimiento</option>
<option>Educación</option>
<option>Salud</option>
<option>Ropa</option>
<option>Servicios</option>
<option>Suscripciones</option>
<option>Otros</option>
</select>
<label>Descripción</label>
<input type="text" id="desc">
<button onclick="addExpense()">Agregar gasto</button>
</div>

<div id="advice" class="alert ok">Esperando datos...</div>
<div id="list"></div>

<div class="chat section">
<label>Preguntale a la IA</label>
<input type="text" id="question" placeholder="¿Cómo puedo ahorrar más?">
<button onclick="askAI()">Preguntar</button>
</div>

<button class="pro" onclick="togglePro()">Modo PRO</button>
</div>

<script>
let expenses=[];let pro=false;
function addExpense(){
const amount=Number(document.getElementById('amount').value);
const cat=document.getElementById('category').value;
if(!amount)return;
expenses.push({amount,cat});
update();}

function update(){
const total=expenses.reduce((a,b)=>a+b.amount,0);
const goal=Number(document.getElementById('goal').value);
const adv=document.getElementById('advice');
let msg='Vas bien con tus gastos.';
let cls='ok';
if(goal && total>goal){cls='warn';msg=advancedAdvice();}
adv.className='alert '+cls;adv.innerText=msg;
render();}

function advancedAdvice(){
const sum={Comida:0,Transporte:0,Entretenimiento:0,Educación:0,Salud:0,Ropa:0,Servicios:0,Suscripciones:0,Otros:0};
expenses.forEach(e=>sum[e.cat]+=e.amount);
let top=Object.keys(sum).reduce((a,b)=>sum[a]>sum[b]?a:b);
let base='Te pasaste de tu meta. ';
let tips={
Comida:['cociná en casa','evitá delivery seguido','planificá menús'],
Transporte:['usá transporte público','compartí viajes','caminá trayectos cortos'],
Entretenimiento:['buscá planes gratis','limitá salidas pagas','aprovechá descuentos'],
Educación:['usá recursos online gratis','comprá usado','priorizá lo necesario'],
Salud:['compará farmacias','prevención antes que gasto','seguí tratamientos'],
Ropa:['comprá solo lo necesario','aprovechá ofertas','evitá compras impulsivas'],
Servicios:['revisá planes','bajá consumo','negociá tarifas'],
Suscripciones:['cancelá las que no usás','compartí planes','revisá mensualmente'],
Otros:['postergá gastos','compará precios','pensalo 24hs']};
let t=tips[top][Math.floor(Math.random()*tips[top].length)];
return base+'Gastás más en '+top+'. Consejo: '+t;
}

function render(){
const list=document.getElementById('list');
list.innerHTML='';
expenses.forEach(e=>{list.innerHTML+=`<div class="item">${e.cat}: $${e.amount}</div>`});}

function askAI(){
const q=document.getElementById('question').value.toLowerCase();
let r='Controlar tus gastos es clave.';
if(q.includes('comida'))r='Reducí delivery y planificá comidas.';
if(q.includes('transporte'))r='Probá opciones más económicas.';
if(q.includes('ahorrar'))r='Definí metas claras y evitá impulsos.';
document.getElementById('advice').innerText=r;
}

function togglePro(){pro=!pro;alert(pro?'Modo PRO activado':'Modo PRO desactivado');}
</script>
</body>
</html>
