<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMind</title>

<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#222;--primary:#667eea}
body.dark{--bg:#121212;--card:#1e1e1e;--text:#fff}

body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--text)}

header{background:var(--primary);color:white;text-align:center;padding:15px;position:relative}

.menu-btn{
  position:absolute;left:10px;top:10px;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;
  color:white; /* FIX: siempre visible */
}

body.dark .menu-btn{color:white}

.container{padding:15px}

.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:10px}

input,select,button{width:100%;padding:10px;margin-top:8px}

button{
  background:var(--primary);color:white;border:none;
  border-radius:10px;
  transition:0.2s;
}

/* ✨ ANIMACIONES */
button:hover{transform:scale(1.03)}
button:active{transform:scale(0.97)}

.mobile-menu{
  position:fixed;top:60px;left:10px;
  background:white;border-radius:10px;padding:10px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  z-index:100;
}

.mobile-menu div{padding:10px;cursor:pointer}
.hidden{display:none}
</style>
</head>

<body>

<header>
<div class="menu-btn" onclick="toggleMenu()">⋮</div>
<h2>MoneyMind</h2>
</header>

<div id="mobileMenu" class="mobile-menu hidden">
  <div onclick="showSection('main')">Inicio</div>
  <div onclick="showSection('chart')">Gráfico</div>
  <div onclick="showSection('stats')">Estadísticas</div>
  <div onclick="toggleDark()">Modo oscuro</div>
</div>

<div class="container">

<div id="main">

<div class="card">
<input id="budget" placeholder="Fondo disponible">
<button onclick="saveBudget()">Guardar</button>
<p id="remaining"></p>
</div>

<div class="card">
<input id="income" placeholder="Ingreso">
<button onclick="addIncome()">Agregar ingreso</button>
<button onclick="clearIncomes()">Borrar ingresos</button>
</div>

<div class="card">
<input id="amount" placeholder="Gasto">
<select id="category">
<option>Comida</option>
<option>Transporte</option>
<option>Entretenimiento</option>
<option>Otros</option>
</select>
<button onclick="addExpense()">Agregar gasto</button>
<button onclick="clearExpenses()">Borrar gastos</button>
</div>

<div class="card">
<p id="total"></p>
<div id="list"></div>
</div>
</div>

<div id="chart" class="hidden">
<canvas id="canvas" height="250"></canvas>
</div>

<div id="stats" class="hidden">
<div id="statsContent"></div>
</div>

</div>

<script>
let expenses=JSON.parse(localStorage.getItem('expenses')||'[]');
let incomes=JSON.parse(localStorage.getItem('incomes')||'[]');
let budget=Number(localStorage.getItem('budget')||0);

if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');

document.getElementById('budget').value=budget;

function toggleMenu(){
  document.getElementById('mobileMenu').classList.toggle('hidden');
}

function showSection(id){
  document.getElementById('main').classList.add('hidden');
  document.getElementById('chart').classList.add('hidden');
  document.getElementById('stats').classList.add('hidden');

  document.getElementById(id).classList.remove('hidden');

  toggleMenu();
  drawChart();
  render();
}

function toggleDark(){
  document.body.classList.toggle('dark');
  localStorage.setItem('dark',document.body.classList.contains('dark'));
}

function saveBudget(){
  budget=Number(document.getElementById('budget').value);
  localStorage.setItem('budget',budget);
  render();
}

function addIncome(){
  let val=Number(document.getElementById('income').value);
  if(!val)return;
  incomes.push(val);
  localStorage.setItem('incomes',JSON.stringify(incomes));
  render();
}

function clearIncomes(){
  if(confirm("¿Borrar todos los ingresos?")){
    incomes=[];
    localStorage.removeItem('incomes');
    render();
  }
}

function addExpense(){
  let val=Number(document.getElementById('amount').value);
  let cat=document.getElementById('category').value;
  if(!val)return;
  expenses.push({amount:val,cat});
  localStorage.setItem('expenses',JSON.stringify(expenses));
  render();
  drawChart();
}

function clearExpenses(){
  if(confirm("¿Borrar todos los gastos?")){
    expenses=[];
    localStorage.removeItem('expenses');
    render();
    drawChart();
  }
}

function render(){
  let spent=expenses.reduce((a,b)=>a+b.amount,0);
  let earned=incomes.reduce((a,b)=>a+b,0);

  document.getElementById('remaining').innerText=
  "Disponible: $" + (budget+earned-spent);

  document.getElementById('total').innerText=
  "Ingresos: "+earned+" | Gastos: "+spent;

  let list="";
  incomes.forEach(i=>list+=`<div>+ $${i}</div>`);
  expenses.forEach(e=>list+=`<div>- $${e.amount} (${e.cat})</div>`);
  document.getElementById('list').innerHTML=list;

  drawStats();
}

function drawChart(){
  let c=document.getElementById('canvas');
  let ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);

  let sums={};
  expenses.forEach(e=>sums[e.cat]=(sums[e.cat]||0)+e.amount);

  let keys=Object.keys(sums);
  if(!keys.length){
    ctx.fillText("No hay datos",20,40);
    return;
  }

  let max=Math.max(...Object.values(sums));

  keys.forEach((k,i)=>{
    let h=(sums[k]/max)*200;
    ctx.fillRect(40+i*60,240-h,30,h);
    ctx.fillText(k,40+i*60,250);
  });
}

function drawStats(){
  let c={};
  expenses.forEach(e=>c[e.cat]=(c[e.cat]||0)+1);

  let txt="";
  for(let k in c){txt+=k+": "+c[k]+"<br>"}

  document.getElementById('statsContent').innerHTML=txt;
}

render();
</script>

</body>
</html>
