<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MoneyMind</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

h1 {
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 8px;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  background: #27ae60;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover { background: #219150; }

.delete { background: #e74c3c; }
.delete:hover { background: #c0392b; }

.pro { background: #2980b9; }
.pro:hover { background: #1f5f8b; }

.total {
  margin-top: 15px;
  font-weight: bold;
}

.advice {
  margin-top: 15px;
  background: #ecf0f1;
  padding: 10px;
  border-radius: 5px;
}

.expense {
  border-bottom: 1px solid #ddd;
  padding: 5px 0;
}

canvas {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>MoneyMind – tu dinero claro con inteligencia automática</h1>

<div class="container">

<input type="number" id="amount" placeholder="Monto">
<select id="category">
  <option>Comida</option>
  <option>Transporte</option>
  <option>Entretenimiento</option>
  <option>Otros</option>
</select>
<input type="text" id="description" placeholder="Descripción">

<button onclick="addExpense()">Agregar gasto</button>
<button class="delete" onclick="clearExpenses()">Borrar todos los gastos</button>
<button class="pro" onclick="togglePro()">Activar / Desactivar modo PRO</button>

<div class="total" id="total">Total gastado: $0</div>
<div class="advice" id="advice">Consejo IA: empezá registrando tus gastos.</div>

<canvas id="chart" width="600" height="300"></canvas>

<div id="expenses"></div>

</div>

<script>
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const descriptionInput = document.getElementById("description");
const list = document.getElementById("expenses");
const totalDiv = document.getElementById("total");
const adviceDiv = document.getElementById("advice");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let expenses = [];
let proMode = false;

const savedExpenses = localStorage.getItem("expenses");
if (savedExpenses) expenses = JSON.parse(savedExpenses);

const savedPro = localStorage.getItem("proMode");
if (savedPro === "true") proMode = true;

render();

// 1️⃣ GRÁFICO DE GASTOS
function drawChart(categories) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const keys = Object.keys(categories);
  if (keys.length === 0) return;

  const values = Object.values(categories);
  const max = Math.max(...values);
  const barWidth = 80;
  const gap = 40;

  keys.forEach((key, i) => {
    const height = (values[i] / max) * 200;
    const x = 50 + i * (barWidth + gap);
    const y = 250 - height;

    ctx.fillStyle = "#3498db";
    ctx.fillRect(x, y, barWidth, height);

    ctx.fillStyle = "black";
    ctx.fillText(key, x, 270);
    ctx.fillText("$" + values[i], x, y - 5);
  });
}

// 2️⃣ CONSEJOS IA MEJORADOS
function generateAdvice(total, categories) {
  let advice = "Buen control de gastos.";
  let biggest = "";
  let max = 0;

  for (let c in categories) {
    if (categories[c] > max) {
      max = categories[c];
      biggest = c;
    }
  }

  if (total === 0) {
    advice = "Todavía no registraste gastos.";
  } else if (total > 30000) {
    advice = "Nivel de gasto alto. Intentá fijarte un límite semanal.";
  } else if (biggest) {
    advice = `El mayor gasto es ${biggest}. Podrías reducirlo un poco.`;
  }

  if (proMode) {
    advice += " Análisis PRO: si bajás un 10% este gasto, ahorrarías más este mes.";
  }

  adviceDiv.textContent = "Consejo IA: " + advice;
}

function clearExpenses() {
  if (!confirm("¿Seguro que querés borrar todo?")) return;
  expenses = [];
  localStorage.removeItem("expenses");
  render();
}

function togglePro() {
  proMode = !proMode;
  localStorage.setItem("proMode", proMode);
  alert(proMode ? "Modo PRO activado" : "Modo PRO desactivado");
  render();
}

function addExpense() {
  const amount = Number(amountInput.value);
  if (amount <= 0) return;

  expenses.push({
    amount,
    category: categoryInput.value,
    description: descriptionInput.value,
    date: new Date().toLocaleDateString()
  });

  localStorage.setItem("expenses", JSON.stringify(expenses));
  amountInput.value = "";
  descriptionInput.value = "";
  render();
}

function render() {
  list.innerHTML = "";
  let total = 0;
  let categories = {};

  expenses.forEach(e => {
    total += e.amount;
    categories[e.category] = (categories[e.category] || 0) + e.amount;

    const div = document.createElement("div");
    div.className = "expense";
    div.textContent = `${e.date} | $${e.amount} | ${e.category} | ${e.description}`;
    list.appendChild(div);
  });

  totalDiv.textContent = "Total gastado: $" + total;
  generateAdvice(total, categories);
  drawChart(categories);
}
</script>

</body>
</html>
