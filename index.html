<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MoneyMind</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: #27ae60;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #219150;
    }

    .total {
      margin-top: 20px;
      font-weight: bold;
    }

    .expense {
      border-bottom: 1px solid #ddd;
      padding: 5px 0;
    }

    .advice {
      margin-top: 15px;
      background: #ecf0f1;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h1>MoneyMind – tu dinero claro con inteligencia automática</h1>

  <div class="container">
    <input type="date" id="birthdate">
    <input type="number" id="amount" placeholder="Monto">
    
    <select id="category">
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Entretenimiento">Entretenimiento</option>
      <option value="Otros">Otros</option>
    </select>

    <input type="text" id="description" placeholder="Descripción">

    <button onclick="addExpense()">Agregar gasto</button>

    <div class="total" id="total">Total gastado: $0</div>

    <div class="advice" id="advice">Consejo IA: empezá registrando tus gastos.</div>

    <div id="expenses"></div>
  </div>

  <script>
    let expenses = [];

    // CARGAR GASTOS GUARDADOS
    const savedExpenses = localStorage.getItem("expenses");
    if (savedExpenses) {
      expenses = JSON.parse(savedExpenses);
      renderExpenses();
    }

    function addExpense() {
      const amount = Number(document.getElementById("amount").value);
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value;
      const date = new Date().toLocaleDateString();

      if (!amount || amount <= 0) return;

      expenses.push({
        date,
        amount,
        category,
        description
      });

      localStorage.setItem("expenses", JSON.stringify(expenses));

      document.getElementById("amount").value = "";
      document.getElementById("description").value = "";

      renderExpenses();
    }

    function renderExpenses() {
      const list = document.getElementById("expenses");
      list.innerHTML = "";

      let total = 0;

      expenses.forEach(exp => {
        total += exp.amount;

        const div = document.createElement("div");
        div.className = "expense";
        div.textContent = `${exp.date} | $${exp.amount} | ${exp.category} | ${exp.description}`;
        list.appendChild(div);
      });

      document.getElementById("total").textContent = `Total gastado: $${total}`;
      generateAdvice(total);
    }

    function generateAdvice(total) {
      let advice = "Vas bien controlando tus gastos.";

      if (total > 10000) {
        advice = "Estás gastando bastante. Revisá en qué podés ahorrar.";
      } else if (total > 5000) {
        advice = "Buen control, pero podrías reducir algunos gastos.";
      }

      document.getElementById("advice").textContent = "Consejo IA: " + advice;
    }
  </script>

</body>
</html>
