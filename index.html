<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MoneyMind</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #2c3e50;
}

.container {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

button:hover { background: #219150; }

.delete {
  background: #e74c3c;
}

.delete:hover { background: #c0392b; }

.pro {
  background: #2980b9;
}

.locked {
  background: #7f8c8d;
  cursor: not-allowed;
}

.total {
  margin-top: 15px;
  font-weight: bold;
  font-size: 18px;
}

.green { color: #27ae60; }
.red { color: #e74c3c; }
.orange { color: #e67e22; }

.advice {
  margin-top: 15px;
  background: #ecf0f1;
  padding: 15px;
  border-radius: 8px;
}

.expense {
  border-bottom: 1px solid #ddd;
  padding: 6px 0;
}

canvas {
  margin-top: 20px;
}
</style>
</head>

<body>

<h1>MoneyMind – tu dinero claro con inteligencia automática</h1>

<div class="container">

<input type="number" id="budget" placeholder="💰 ¿Cuánta plata tenés disponible?">
<button onclick="saveBudget()">Guardar monto</button>

<hr>

<input type="number" id="amount" placeholder="Monto del gasto">
<select id="category">
  <option>Comida</option>
  <option>Transporte</option>
  <option>Entretenimiento</option>
  <option>Otros</option>
</select>
<input type="text" id="description" placeholder="Descripción del gasto">

<button onclick="addExpense()">Agregar gasto</button>
<button class="delete" onclick="clearExpenses()">Borrar todos los gastos</button>
<button id="proBtn" class="pro locked" onclick="showProInfo()">Modo PRO (Premium)</button>

<div class="total" id="total"></div>
<div class="total" id="remaining"></div>

<div class="advice" id="advice"></div>

<canvas id="chart" width="650" height="300"></canvas>

<div id="expenses"></div>

</div>

<script>
const amountInput = document.getElementById("amount");
const categoryInput = document.getElementById("category");
const descriptionInput = document.getElementById("description");
const budgetInput = document.getElementById("budget");
const list = document.getElementById("expenses");
const totalDiv = document.getElementById("total");
const remainingDiv = document.getElementById("remaining");
const adviceDiv = document.getElementById("advice");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let expenses = JSON.parse(localStorage.getItem("expenses") || "[]");
let budget = Number(localStorage.getItem("budget") || 0);

if (budget > 0) budgetInput.value = budget;

render();

// 💰 Presupuesto
function saveBudget() {
  const value = Number(budgetInput.value);
  if (value <= 0) return alert("Ingresá un monto válido");
  budget = value;
  localStorage.setItem("budget", budget);
  render();
}

// 🔒 Info PRO
function showProInfo() {
  alert(
    "Modo PRO (Premium)\n\n" +
    "✔ Gráficos avanzados\n" +
    "✔ Consejos inteligentes\n" +
    "✔ Análisis de ahorro\n\n" +
    "Disponible próximamente."
  );
}

// ➕ Agregar gasto
function addExpense() {
  const amount = Number(amountInput.value);
  if (amount <= 0) return;

  expenses.push({
    amount,
    category: categoryInput.value,
    description: descriptionInput.value,
    date: new Date().toLocaleDateString()
  });

  localStorage.setItem("expenses", JSON.stringify(expenses));
  amountInput.value = "";
  descriptionInput.value = "";
  render();
}

// 🗑️ Borrar
function clearExpenses() {
  if (!confirm("¿Seguro que querés borrar todo?")) return;
  expenses = [];
  localStorage.removeItem("expenses");
  render();
}

// 🧠 Consejos IA
function generateAdvice(total, remaining, categories) {
  let msgs = [];

  if (total === 0) msgs.push("Buen comienzo, todavía no gastaste nada.");
  if (remaining < 0) msgs.push("⚠️ Estás gastando más de lo que tenés.");
  if (remaining <= budget * 0.2 && remaining >= 0)
    msgs.push("⚠️ Te queda menos del 20% de tu plata.");

  let maxCat = "", max = 0;
  for (let c in categories) {
    if (categories[c] > max) {
      max = categories[c];
      maxCat = c;
    }
  }

  if (maxCat) msgs.push(`Gastás más en ${maxCat}.`);

  msgs.push("Activá PRO para consejos avanzados y gráficos.");

  adviceDiv.innerHTML = "🤖 Consejo IA:<br>• " + msgs.join("<br>• ");
}

// 📊 Gráfico (demo)
function drawChart(categories) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const keys = Object.keys(categories);
  if (keys.length === 0) return;

  const values = Object.values(categories);
  const max = Math.max(...values);

  keys.forEach((k, i) => {
    const h = (values[i] / max) * 200;
    const x = 60 + i * 120;
    const y = 250 - h;
    ctx.fillStyle = "#3498db";
    ctx.fillRect(x, y, 80, h);
    ctx.fillStyle = "black";
    ctx.fillText(k, x, 270);
    ctx.fillText("$" + values[i], x, y - 5);
  });
}

// 🔄 Render
function render() {
  list.innerHTML = "";
  let total = 0;
  let categories = {};

  expenses.forEach(e => {
    total += e.amount;
    categories[e.category] = (categories[e.category] || 0) + e.amount;

    const div = document.createElement("div");
    div.className = "expense";
    div.textContent = `${e.date} | $${e.amount} | ${e.category} | ${e.description}`;
    list.appendChild(div);
  });

  const remaining = budget - total;

  totalDiv.textContent = `Total gastado: $${total}`;
  remainingDiv.textContent = `Plata restante: $${remaining}`;

  remainingDiv.className =
    remaining < 0 ? "total red" :
    remaining <= budget * 0.2 ? "total orange" :
    "total green";

  generateAdvice(total, remaining, categories);
  drawChart(categories);
}
</script>

</body>
</html>
