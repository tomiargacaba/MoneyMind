<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMind</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#222;--primary:#667eea}
body.dark{--bg:#121212;--card:#1e1e1e;--text:#f2f2f2}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);transition:.3s}
header{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--primary);color:#fff;position:relative}
h1{font-size:20px;margin:0}
.menu-btn{position:absolute;left:14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.container{padding:15px 15px 15px 30px}
.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:15px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
label{font-weight:600;font-size:14px}
input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:1px solid #ccc;font-size:14px}
button{background:var(--primary);color:#fff;border:none;font-weight:600}
button.danger{background:#e74c3c}
.total{font-weight:600;margin-top:6px}
#drawer{position:fixed;top:0;left:-260px;width:260px;height:100%;background:var(--card);transition:left .3s ease;padding:20px;z-index:10}
#drawer.open{left:0;box-shadow:5px 0 20px rgba(0,0,0,.25)}
@media(max-width:768px){#drawer{display:none}}
#drawer.open{left:0;box-shadow:5px 0 20px rgba(0,0,0,.25)}
.drawer-item{padding:14px 0;border-bottom:1px solid #eee;cursor:pointer;font-weight:600}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:none;z-index:9}
.hidden{display:none}
.expense{font-size:13px;border-bottom:1px solid #eee;padding:6px 0}
.income{color:#2ecc71;font-weight:600}
.toggle{display:flex;justify-content:space-between;align-items:center}
.switch{width:42px;height:22px;background:#ccc;border-radius:22px;position:relative}
.switch span{position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.3s}
body.dark .switch span{left:22px}
</style>
</head>
<body>
<div id="overlay" onclick="toggleMenu()"></div>
<div id="drawer">
<div class="drawer-item" onclick="showSection('main')">🏠 Inicio</div>
<div class="drawer-item" onclick="showSection('chart')">📊 Gráfico</div>
<div class="drawer-item" onclick="showSection('stats')">📈 Estadísticas</div>
<div class="drawer-item toggle" onclick="toggleDark()">🌙 Modo oscuro<div class="switch"><span></span></div></div>
<div class="drawer-item" onclick="alert('Modo PRO bloqueado 🔒')">⭐ Modo PRO</div>
</div>
<header>
<div class="menu-btn" onclick="toggleMenu()">⋮</div>
<h1>MoneyMind</h1>
</header>
<div class="container">
<div id="main" class="section">
<div class="card">
<label>Fondo disponible</label>
<input type="number" id="budget" placeholder="Ej: 200000">
<button onclick="saveBudget()">Guardar fondo</button>
<div class="total" id="remaining"></div>
</div>
<div class="card">
<label>Agregar ingreso</label>
<input type="number" id="incomeAmount" placeholder="Monto">
<input type="text" id="incomeDesc" placeholder="Descripción">
<button onclick="addIncome()">Agregar ingreso</button>
</div>
<div class="card">
<label>Nuevo gasto</label>
<input type="number" id="amount" placeholder="Monto">
<select id="category">
<option>Comida</option><option>Transporte</option><option>Entretenimiento</option><option>Educación</option><option>Salud</option><option>Ropa</option><option>Servicios</option><option>Suscripciones</option><option>Otros</option>
</select>
<input type="text" id="desc" placeholder="Descripción">
<button onclick="addExpense()">Agregar gasto</button>
<button class="danger" onclick="clearExpenses()">Borrar gastos</button>
</div>
<div class="card">
<div class="total" id="total"></div>
<div id="list"></div>
</div>
</div>
<div id="chart" class="section hidden"><div class="card"><canvas id="barChart" height="250"></canvas></div></div>
<div id="stats" class="section hidden"><div class="card" id="statsContent"></div></div>
</div>
<script>
let expenses=JSON.parse(localStorage.getItem('expenses')||'[]');
let incomes=JSON.parse(localStorage.getItem('incomes')||'[]');
let budget=Number(localStorage.getItem('budget')||0);
document.getElementById('budget').value=budget||'';
function toggleMenu(){const d=drawer;d.classList.toggle('open');overlay.style.display=d.classList.contains('open')?'block':'none';}
function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');toggleMenu();render();}
function toggleDark(){document.body.classList.toggle('dark');}
function saveBudget(){budget=Number(budgetInput.value||budget);localStorage.setItem('budget',budget);render();}
function addIncome(){const a=Number(incomeAmount.value);if(!a)return;incomes.push({amount:a,desc:incomeDesc.value});localStorage.setItem('incomes',JSON.stringify(incomes));incomeAmount.value='';incomeDesc.value='';render();}
function addExpense(){const a=Number(amount.value);if(!a)return;expenses.push({amount:a,cat:category.value});localStorage.setItem('expenses',JSON.stringify(expenses));amount.value='';render();}
function clearExpenses(){if(confirm('¿Borrar todos los gastos?')){expenses=[];localStorage.removeItem('expenses');render();}}
function render(){let spent=expenses.reduce((s,e)=>s+e.amount,0);let earned=incomes.reduce((s,i)=>s+i.amount,0);remaining.innerText='Disponible: $'+(budget+earned-spent);total.innerText=`Ingresos: $${earned} · Gastos: $${spent}`;list.innerHTML='';incomes.forEach(i=>list.innerHTML+=`<div class="expense income">+ $${i.amount}</div>`);expenses.forEach(e=>list.innerHTML+=`<div class="expense">- $${e.amount} · ${e.cat}</div>`);drawStats();}
function drawChart(){const c=document.getElementById('barChart');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let sums={};expenses.forEach(e=>sums[e.cat]=(sums[e.cat]||0)+e.amount);let keys=Object.keys(sums);if(!keys.length){ctx.fillText('No hay gastos aún',20,40);return;}let max=Math.max(...Object.values(sums));keys.forEach((k,i)=>{let h=(sums[k]/max)*180;ctx.fillStyle='#667eea';ctx.fillRect(40+i*60,220-h,35,h);ctx.fillStyle='#000';ctx.fillText(k,40+i*60,240);ctx.fillText('$'+sums[k],40+i*60,210-h);});}
function drawStats(){let c={};expenses.forEach(e=>c[e.cat]=(c[e.cat]||0)+1);let h='<b>Resumen</b><br>';for(let k in c)h+=`${k}: ${c[k]}<br>`;statsContent.innerHTML=h;}
render();
</script>
</body>
</html>
